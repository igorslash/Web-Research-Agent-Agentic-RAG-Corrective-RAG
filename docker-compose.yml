services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: arize-phoenix
    ports:
      - "6006:6006"   # Phoenix UI & HTTP OTLP collector
      - "4317:4317"   # gRPC OTLP collector
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix_data:/mnt/data
    restart: unless-stopped

  research-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deep-research-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PHOENIX_ENABLED=true
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_PROJECT_NAME=deep-research-rag-agent
    depends_on:
      - phoenix
    restart: unless-stopped

volumes:
  phoenix_data:
